name: Validate data

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  setup:
    runs-on: windows-latest
    outputs:
      artifact-name: setup-data-${{ github.run_id }}
    steps:
      # ========== Phase 1: Main setup ==========
      - name: "Checkout: Main repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========== Phase 2: Fetch data by region (CN/EN/JP/KR/TW) ==========
      - name: "Data: AzurLane game (CN/EN/JP/KR/TW)"
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneData
          ref: main
          path: _external/AzurLaneData
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            CN
            EN
            JP
            KR
            TW
            versions

      - name: "Data: AzurLane version info (CN/EN/JP/KR/TW)"
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneLuaScripts
          ref: main
          path: _external/AzurLaneLuaScripts
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            versions/CN.txt
            versions/EN.txt
            versions/JP.txt
            versions/KR.txt
            versions/TW.txt

      - name: "Data: Belfast fallback"
        uses: actions/checkout@v4
        with:
          repository: ggmolly/belfast-data
          path: _external/belfast-data

      # ========== Phase 3: Setup tools ==========
      - name: "Setup: Go toolchain"
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ========== Phase 4: Upload setup artifacts ==========
      - name: "Upload: Setup artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ outputs.artifact-name }}
          path: _external
          retention-days: 1

  validate:
    needs: setup
    strategy:
      matrix:
        region: [CN, EN, JP, KR, TW]
    runs-on: windows-latest
    steps:
      # ========== Phase 1: Setup ==========
      - name: "Checkout: Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Download: Setup artifacts"
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.setup.outputs.artifact-name }}
          path: _external

      - name: "Setup: Go toolchain"
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ========== Phase 2: Validate (CN/EN/JP/KR/TW → Belfast JSON) ==========
      - name: "Validate: Belfast JSON (${{ matrix.region }})"
        shell: pwsh
        run: tools/ci/validate.ps1

      # ========== Phase 3: Upload results ==========
      - name: "Upload: Validation results (${{ matrix.region }})"
        uses: actions/upload-artifact@v4
        with:
          name: amagi-belfast-json-mvp-${{ matrix.region }}
          path: ${{ runner.temp }}/amagi_belfast_json_mvp
          retention-days: 30
