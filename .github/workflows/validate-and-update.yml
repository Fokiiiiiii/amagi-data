name: Validate and Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # 24:00 JST

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ========== Phase 1: Main setup ==========
      - name: "Checkout: Main repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========== Phase 2: Check whether this upstream revision was processed ==========
      - name: "Data: Get latest AzurLaneLuaScripts SHA"
        id: upstream
        run: echo "sha=$(git ls-remote https://github.com/AzurLaneTools/AzurLaneLuaScripts.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: "Cache: Check processed data"
        id: processed
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/amagi-data-processed
          key: processed-${{ steps.upstream.outputs.sha }}-${{ hashFiles('cmd/**', 'internal/**', 'tools/ci/**', 'go.mod') }}

      # ========== Phase 3: Fetch latest Lua source (CN/EN/JP/KR/TW + versions) ==========
      - name: "Data: AzurLaneLuaScripts"
        if: steps.processed.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneLuaScripts
          ref: ${{ steps.upstream.outputs.sha }}
          path: _external/AzurLaneLuaScripts
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            CN
            EN
            JP
            KR
            TW
            versions

      # ========== Phase 4: Setup tools ==========
      - name: "Setup: Go toolchain"
        if: steps.processed.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ========== Phase 5: Test code ==========
      - name: "Test: Code validation"
        if: steps.processed.outputs.cache-hit != 'true'
        run: tools/ci/test.sh

      # ========== Phase 6: Generate Belfast JSON (all regions, single pass) ==========
      - name: "Generate: Belfast JSON"
        if: steps.processed.outputs.cache-hit != 'true'
        run: tools/ci/generate.sh

      # ========== Phase 7: Verify generated output ==========
      - name: "Verify: Generated output"
        if: steps.processed.outputs.cache-hit != 'true'
        run: tools/ci/verify-generated.sh

      # ========== Phase 8: Mark processed revision ==========
      - name: "Cache: Mark processed data"
        if: steps.processed.outputs.cache-hit != 'true'
        run: mkdir -p "${{ runner.temp }}/amagi-data-processed" && touch "${{ runner.temp }}/amagi-data-processed/done"

      # ========== Phase 9: Commit & Push ==========
      - name: "Commit: Generated data"
        if: steps.processed.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ -n "$(git status --short)" ]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add --all
            git commit -m "data: update generated belfast json [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No generated file changes to commit"
          fi
