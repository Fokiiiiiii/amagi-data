name: Sync Versions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write

concurrency:
  group: amagi-data-version-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sync global versions
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = {
              owner: "AzurLaneTools",
              repo: "AzurLaneLuaScripts",
              branch: "main",
            };
            const regions = ["TW", "KR", "CN", "JP", "EN"];
            const targetPath = "global/versions.json";
            const targetBranch = context.payload.repository.default_branch;

            const branch = await github.rest.repos.getBranch({
              owner: upstream.owner,
              repo: upstream.repo,
              branch: upstream.branch,
            });
            const upstreamSha = branch.data.commit.sha;

            const entries = await Promise.all(regions.map(async (region) => {
              const response = await github.rest.repos.getContent({
                owner: upstream.owner,
                repo: upstream.repo,
                path: `versions/${region}.txt`,
                ref: upstreamSha,
              });
              if (Array.isArray(response.data) || response.data.type !== "file" || !response.data.content) {
                throw new Error(`Invalid upstream version file: ${region}`);
              }
              const version = Buffer.from(response.data.content, "base64").toString("utf8").trim();
              if (!/^\d+(?:\.\d+){2,3}$/.test(version)) {
                throw new Error(`Invalid ${region} version: ${JSON.stringify(version)}`);
              }
              return [region, version];
            }));
            const next = Object.fromEntries(entries);

            const currentResponse = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: targetPath,
              ref: targetBranch,
            });
            if (Array.isArray(currentResponse.data) || currentResponse.data.type !== "file" || !currentResponse.data.content) {
              throw new Error(`Invalid target file: ${targetPath}`);
            }
            const currentText = Buffer.from(currentResponse.data.content, "base64").toString("utf8");
            const current = JSON.parse(currentText);

            const changed = regions.some((region) => current[region] !== next[region]);
            if (!changed) {
              core.info(`Versions already current at upstream ${upstreamSha.slice(0, 12)}`);
              return;
            }

            const content = [
              "{",
              `    \"TW\":\"${next.TW}\",`,
              `    \"KR\":\"${next.KR}\",`,
              `    \"CN\":\"${next.CN}\",`,
              `    \"JP\":\"${next.JP}\",`,
              `    \"EN\":\"${next.EN}\"`,
              "}",
              "",
            ].join("\r\n");

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: targetPath,
              branch: targetBranch,
              message: `data: sync versions from ${upstreamSha.slice(0, 12)} [skip ci]`,
              content: Buffer.from(content, "utf8").toString("base64"),
              sha: currentResponse.data.sha,
            });

            for (const region of regions) {
              core.info(`${region}: ${current[region] ?? "missing"} -> ${next[region]}`);
            }
