name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      # ========== Phase 1: Main setup ==========
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========== Phase 2: Fetch data by region (CN/EN/JP/KR/TW) ==========
      - name: Fetch AzurLane game data (CN/EN/JP/KR/TW)
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneData
          ref: main
          path: _external/AzurLaneData
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            CN
            EN
            JP
            KR
            TW
            versions

      - name: Fetch AzurLane version info (CN/EN/JP/KR/TW)
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneLuaScripts
          ref: main
          path: _external/AzurLaneLuaScripts
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            versions/CN.txt
            versions/EN.txt
            versions/JP.txt
            versions/KR.txt
            versions/TW.txt

      - name: Fetch belfast-data
        uses: actions/checkout@v4
        with:
          repository: ggmolly/belfast-data
          path: _external/belfast-data

      # ========== Phase 3: Setup tools ==========
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ========== Phase 4: Process data (CN/EN/JP/KR/TW → Belfast JSON) ==========
      - name: Generate Belfast JSON (CN/EN/JP/KR/TW regions)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Native {
            param([Parameter(ValueFromRemainingArguments=$true)][string[]]$Args)
            & $Args[0] $Args[1..($Args.Count - 1)]
            if ($LASTEXITCODE -ne 0) {
              throw "$($Args -join ' ') failed with exit code $LASTEXITCODE"
            }
          }

          # validate.ps1 sets AMAGI_DATA_TEST_* and runs go test + go run belfast_json_mvp
          Invoke-Native pwsh -NoProfile -ExecutionPolicy Bypass -File tools/ci/validate.ps1

          $out = Join-Path $env:RUNNER_TEMP "amagi_belfast_json_mvp"

          if (-not (Test-Path $out)) { throw "output dir missing: $out" }
          $reportPath = Join-Path $out "belfast-json-mvp-report.json"
          if (-not (Test-Path $reportPath)) { throw "report missing: $reportPath" }

          Get-ChildItem -LiteralPath $out -Force | ForEach-Object {
            if ($_.Name -eq "belfast-json-mvp-report.json") { return }
            $dst = Join-Path $env:GITHUB_WORKSPACE $_.Name
            if (Test-Path $dst) {
              Remove-Item -LiteralPath $dst -Recurse -Force
            }
            Copy-Item -LiteralPath $_.FullName -Destination $dst -Recurse -Force
          }

          $changes = git status --short
          if ($changes) {
            # Set committer identity required by git commit (actions/checkout sets auth
            # credentials for push but does NOT configure user.name or user.email).
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            # Stage all workspace changes. _external/ is gitignored so it is safe.
            # Call git directly: Invoke-Native mis-binds flag-like args (-A, --all)
            # against its own -Args parameter before ValueFromRemainingArguments fires.
            git add --all
            if ($LASTEXITCODE -ne 0) { throw "git add --all failed with exit code $LASTEXITCODE" }
            Invoke-Native git commit -m "data: update generated belfast json [skip ci]"
            Invoke-Native git push origin main
          } else {
            Write-Host "No generated file changes to commit."
          }
