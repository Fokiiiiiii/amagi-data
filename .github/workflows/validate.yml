name: Validate data

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      # ========== Phase 1: Main setup ==========
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========== Phase 2: Fetch data by region (CN/EN/JP/KR/TW) ==========
      - name: Fetch AzurLane game data (CN/EN/JP/KR/TW)
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneData
          ref: main
          path: _external/AzurLaneData
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            CN
            EN
            JP
            KR
            TW
            versions

      - name: Fetch AzurLane version info (CN/EN/JP/KR/TW)
        uses: actions/checkout@v4
        with:
          repository: AzurLaneTools/AzurLaneLuaScripts
          ref: main
          path: _external/AzurLaneLuaScripts
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            versions/CN.txt
            versions/EN.txt
            versions/JP.txt
            versions/KR.txt
            versions/TW.txt

      - name: Fetch belfast-data
        uses: actions/checkout@v4
        with:
          repository: ggmolly/belfast-data
          path: _external/belfast-data

      # ========== Phase 3: Setup tools ==========
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ========== Phase 4: Process data (CN/EN/JP/KR/TW → Belfast JSON) ==========
      - name: Generate Belfast JSON (CN/EN/JP/KR/TW regions)
        shell: pwsh
        run: tools/ci/validate.ps1

      # ========== Phase 5: Upload results ==========
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: amagi-belfast-json-mvp
          path: ${{ runner.temp }}\amagi_belfast_json_mvp
          retention-days: 30
